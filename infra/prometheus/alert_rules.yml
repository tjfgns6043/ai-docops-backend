groups:
  - name: ai-docops
    rules:
      - alert: HighApi5xxRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is elevated
      - alert: ModelUnavailable
        expr: model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Model server is not ready
      - alert: QueueBacklog
        expr: jobs_total{status="queued"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Worker queue backlog is growing
