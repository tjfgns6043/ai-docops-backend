apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-docops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ai-docops-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-docops-config
            - secretRef:
                name: ai-docops-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
