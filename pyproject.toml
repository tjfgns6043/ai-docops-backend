[project]
name = "ai-docops-backend"
version = "0.1.0"
description = "Operational AI document processing backend portfolio"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "celery>=5.4",
  "fastapi>=0.111",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "prometheus-client>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "libs",
  "services/api",
  "services/model_server",
  "services/worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["libs"]
