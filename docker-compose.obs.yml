services:
  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["obs"]
    ports:
      - "16686:16686"
